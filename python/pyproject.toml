[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks"
version = "0.0.1"
description = "Python strategy authoring + bindings for the stonks C++ backtest engine"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["stonks"]
include-package-data = true

[tool.setuptools.package-data]
stonks = ["_core*.so", "*.pyi"]
